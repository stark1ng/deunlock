# deunlock-net — LAN transport: mDNS discovery + TLS 1.3 with certificate pinning.
#
# AUDIT-001 D-05 (no channel encryption, no forward secrecy) is closed here:
# the LAN path runs over TLS 1.3, so the challenge frame and the signature are
# never on the wire in the clear, and every session gets fresh ephemeral keys.
#
# The desktop side only. The phone half of this transport lives in the Android
# app (a pinned SSLSocket); this crate defines exactly what it must pin.

[package]
name = "deunlock-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "deunlock LAN transport: mDNS advertise + TLS 1.3 with pinning"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
deunlock-core = { path = "../deunlock-core" }
# Trait only: the LAN backend plugs into the same `Peripheral` seam as BLE, so no
# protocol code depends on which transport is live. `test-fake` is off: the
# fake never ships in a daemon.
deunlock-transport = { path = "../deunlock-transport", default-features = false }
async-trait = "0.1.92"
blake3 = "1"
uuid = "1"
mdns-sd = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
