# Workspace manifest for deunlock.
#
# Roadmap: specs/deunlock/ROADMAP.md — item S-001.
# Spec: specs/deunlock/SPEC.md §4.1 (workspace layout).
# Mirrors the layout of ~/sources/prrr: a top-level package plus a `crates/`
# directory of member crates. No business code lives here yet — S-002+ fills in
# each crate.

[workspace]
members = [
    "crates/deunlock-core",
    "crates/deunlock-transport",
    "crates/deunlock-pam",
    "crates/deunlock-cli",
    "crates/deunlock-mobile",
    "crates/deunlock-net",
    "crates/deunlock-presenced",
]
# The `crates/deunlock-core/fuzz` crate is a stand-alone libFuzzer harness; it is
# only buildable on nightly with `cargo fuzz` instrumentation and is therefore
# kept out of the regular workspace build.
exclude = ["crates/deunlock-core/fuzz"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["deunlock contributors"]
repository = "https://github.com/Mewplane/deunlock"

[workspace.lints.rust]
unsafe_code = "deny"

# Top-level package exists so that the repo-root `tests/` directory (which
# `cargo test --workspace` discovers via the root package) compiles. The root
# package itself ships no library code — every crate of substance lives under
# `crates/`.
[package]
name = "deunlock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Phone-as-key unlock for Linux PAM (workspace root)"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

# Dev-dependencies for the repo-level `tests/` directory. S-008's pam_smoke
# needs no Rust deps (it shells out via `std::process::Command`); S-010's
# bluer_smoke needs `bluer` to drive the radio-side smoke check and `tokio`
# for `#[tokio::test]`. Both are gated on `DEUNLOCK_E2E=1` at runtime and
# default-skip on a developer box without a BLE adapter.
[dev-dependencies]
bluer = { version = "0.17", default-features = false, features = ["bluetoothd"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# DEV-001 TC-11: pins LESC-derived material → MAC + BondStore round-trip.
deunlock-core = { version = "0.3", path = "crates/deunlock-core" }
# DEV-001 TC-11: built-in `Bond` carries `time::OffsetDateTime`.
time = { version = "0.3", features = ["macros"] }
# DEV-003 cross-crate byte-identity: assert the mobile UniFFI
# `session_uuid_for_bond` output matches the desktop transport's
# `session_uuid_for` byte for byte so the phone's scan filter UUID
# set always matches the desktop's advertised service UUID.
deunlock-transport = { version = "0.3", path = "crates/deunlock-transport" }
deunlock-mobile = { version = "0.3", path = "crates/deunlock-mobile" }
uuid = { version = "1" }

[profile.release]
lto = "thin"
codegen-units = 1
